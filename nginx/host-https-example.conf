# EJEMPLO PARA NGINX INSTALADO EN LA VPS, NO para nginx dentro del contenedor.
# Emitir primero los certificados para cada dominio (o automatizar onboarding).
# Cada server_name y certificado de dominio propio requiere gestión TLS.
server {
    listen 443 ssl http2;
    server_name campus.ejemplo.com;
    ssl_certificate /etc/letsencrypt/live/campus.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.ejemplo.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }
}
# Para multiples dominios apuntar todos al MISMO 127.0.0.1:8080.
# No utilizar un único certificado genérico para dominios distintos.
